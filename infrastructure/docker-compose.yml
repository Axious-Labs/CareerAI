version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: careerai-postgres
    restart: always
    environment:
      POSTGRES_USER: careerai
      POSTGRES_PASSWORD: careerai_secret
      POSTGRES_DB: careerai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerai -d careerai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: careerai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js API Gateway Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://careerai:careerai_secret@postgres:5432/careerai_db?schema=public
      JWT_SECRET: super_secret_jwt_key_change_in_production_min_32_chars
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-genai:8001
      AGENT_SERVICE_URL: http://ai-agents:8002
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-genai:
        condition: service_started
      ai-agents:
        condition: service_started

  # Python GenAI Service
  ai-genai:
    build:
      context: ../ai/genai
      dockerfile: Dockerfile
    container_name: careerai-genai
    restart: always
    environment:
      PORT: 8001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_key}
    ports:
      - "8001:8001"

  # Python Agentic AI Service (LangGraph)
  ai-agents:
    build:
      context: ../ai/agents
      dockerfile: Dockerfile
    container_name: careerai-agents
    restart: always
    environment:
      PORT: 8002
      REDIS_URL: redis://redis:6379
    ports:
      - "8002:8002"

volumes:
  postgres_data:
  redis_data:
