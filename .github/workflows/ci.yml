name: CareerAI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ---------------------------------------------------------------------------
  # Track 1: Flutter Mobile App
  # ---------------------------------------------------------------------------
  flutter-ci:
    name: Mobile CI (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd careerai/mobile
          flutter pub get

      - name: Analyze Code
        run: |
          cd careerai/mobile
          flutter analyze

      - name: Run Widget & Unit Tests
        run: |
          cd careerai/mobile
          flutter test

  # ---------------------------------------------------------------------------
  # Track 2: Node.js Backend
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Node.js & TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerai
          POSTGRES_PASSWORD: careerai_secret
          POSTGRES_DB: careerai_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: careerai/backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd careerai/backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd careerai/backend
          npx prisma generate

      - name: Run Linter
        run: |
          cd careerai/backend
          npm run lint

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://careerai:careerai_secret@localhost:5432/careerai_test_db?schema=public
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long
        run: |
          cd careerai/backend
          npm test

  # ---------------------------------------------------------------------------
  # Tracks 3 & 4: Python GenAI & Agentic AI
  # ---------------------------------------------------------------------------
  python-ai-ci:
    name: AI Services CI (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ 'genai', 'agents' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: careerai/ai/${{ matrix.service }}/requirements.txt

      - name: Install Dependencies
        run: |
          cd careerai/ai/${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Run Linter (Ruff)
        run: |
          cd careerai/ai/${{ matrix.service }}
          ruff check .

      - name: Run Pytest Suite
        run: |
          cd careerai/ai/${{ matrix.service }}
          pytest
